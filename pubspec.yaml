name: rawdah
description: "روضة — تطبيق ثقافي وتعليمي وألعاب ومسابقات دينية للأطفال، خالٍ من ذوات الأرواح والموسيقى والإعلانات."
publish_to: 'none'
version: 1.49.0+61

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flame: ">=1.18.0 <2.0.0"
  flutter_tts: ">=4.0.0 <5.0.0"
  shared_preferences: ">=2.2.0 <3.0.0"
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  flutter_riverpod: ^3.0.0
  flutter_svg: ">=2.0.10 <4.0.0"
  hive_ce: ">=2.6.0 <3.0.0"
  hive_ce_flutter: ">=2.1.0 <3.0.0"
  connectivity_plus: ">=6.0.0 <8.0.0"
  crypto: ">=3.0.3 <4.0.0"
  flutter_secure_storage: ">=9.2.0 <11.0.0"
  just_audio: ">=0.9.40 <0.11.0"
  path_provider: ">=2.1.0 <3.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik.ttf
    - family: Baloo
      fonts:
        - asset: assets/fonts/Baloo-500.ttf
          weight: 500
        - asset: assets/fonts/Baloo-700.ttf
          weight: 700
        - asset: assets/fonts/Baloo-800.ttf
          weight: 800
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran.ttf
