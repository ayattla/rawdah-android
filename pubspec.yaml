name: rawdah
description: "روضة — تطبيق ثقافي وتعليمي وألعاب ومسابقات دينية للأطفال، خالٍ من ذوات الأرواح والموسيقى والإعلانات."
publish_to: 'none'
version: 1.0.0+12

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flame: ">=1.18.0 <2.0.0"
  flutter_tts: ">=4.0.0 <5.0.0"
  shared_preferences: ">=2.2.0 <3.0.0"
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik.ttf
    - family: Baloo
      fonts:
        - asset: assets/fonts/Baloo-500.ttf
          weight: 500
        - asset: assets/fonts/Baloo-700.ttf
          weight: 700
        - asset: assets/fonts/Baloo-800.ttf
          weight: 800
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran.ttf
