name: روضة — الفحص والبناء والتوزيع

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------ 1) الجودة
  quality:
    name: الفحص والاختبارات والتغطية
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: تثبيت الحزم
        run: flutter pub get

      - name: فحص الكود
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: الاختبارات مع قياس التغطية
        run: flutter test test --coverage

      - name: بوابة التغطية (طبقة المنطق ≥ 80%)
        run: python3 ci/coverage_gate.py

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  # ------------------------------------------------------------ 2) البناء
  android:
    name: بناء APK و App Bundle
    needs: quality
    runs-on: ubuntu-latest
    env:
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: توليد مجلد أندرويد وتخصيصه
        run: |
          flutter create --platforms=android --org com.rawdah --project-name rawdah .
          rm -f test/widget_test.dart
          python3 ci/patch_android.py
          flutter pub get

      - name: مفتاح توقيع النسخ التجريبية (ثابت حتى تُحدَّث دون حذف)
        run: |
          mkdir -p ~/.android
          cp ci/test-debug.keystore ~/.android/debug.keystore

      - name: مفتاح رفع Google Play (إن وُجد في الأسرار)
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > android/app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/key.properties

      - name: بناء APK مقسّم حسب المعالج
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk app-release.apk

      - name: بناء App Bundle لمتجر Google Play
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols-aab

      - name: ملخص الأحجام
        run: |
          {
            echo "### ملفات البناء"
            for f in build/app/outputs/flutter-apk/app-*-release.apk build/app/outputs/bundle/release/app-release.aab; do
              echo "- $(basename $f): $(du -h $f | cut -f1)"
            done
            if [ "$HAS_UPLOAD_KEY" = "true" ]; then
              echo "- App Bundle موقّع بمفتاح الرفع، وجاهز لـ Google Play"
            else
              echo "- App Bundle موقّع بمفتاح تجريبي: أضف أسرار UPLOAD_* لتجهيزه للمتجر"
            fi
          } >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: rawdah-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/symbols

  # ------------------------------------------------------------ 3) النشر
  release:
    name: إصدار تجريبي على GitHub
    needs: android
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rawdah-android
          path: out
      # الترقيم يكمل بعد آخر إصدار من خط البناء القديم (28)
      - name: رقم الإصدار
        run: echo "BUILD_NO=$((GITHUB_RUN_NUMBER + 28))" >> $GITHUB_ENV
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NO }}
          name: روضة — نسخة تجريبية ${{ env.BUILD_NO }}
          prerelease: true
          files: |
            out/app/outputs/flutter-apk/app-release.apk
            out/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            out/app/outputs/bundle/release/app-release.aab
          body: |
            app-release.apk لأغلب الهواتف (arm64)، وapp-armeabi-v7a-release.apk للهواتف القديمة جدًا.
            app-release.aab حزمة متجر Google Play.
            بلا إعلانات ولا موسيقى ولا صور لذوات الأرواح، ولا محادثات بين الأطفال.

  distribute:
    name: Firebase App Distribution
    needs: android
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: تخطٍّ مؤقت
        if: env.HAS_FIREBASE_KEY != 'true'
        run: echo "### التوزيع التجريبي متوقف حتى يُضاف سر FIREBASE_SERVICE_ACCOUNT" >> $GITHUB_STEP_SUMMARY
      - uses: actions/download-artifact@v4
        if: env.HAS_FIREBASE_KEY == 'true'
        with:
          name: rawdah-android
          path: out
      - name: رفع النسخة إلى المختبرين
        if: env.HAS_FIREBASE_KEY == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: 1:299684362863:android:b0bfcf3de275c72b8eab9a
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: out/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "روضة — نسخة ${{ github.run_number }}"
