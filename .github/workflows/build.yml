name: بناء روضة

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: توليد مجلد أندرويد
        run: |
          flutter --version
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.rawdah --project-name rawdah .
          fi
          rm -rf test
          python3 ci/patch_android.py

      - name: تثبيت الحزم
        run: flutter pub get

      - name: فحص الكود
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: بناء APK
        run: flutter build apk --release

      - name: رفع الملف
        uses: actions/upload-artifact@v4
        with:
          name: rawdah-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: نشر إصدار تجريبي
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: روضة — نسخة تجريبية ${{ github.run_number }}
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            نسخة تجريبية من تطبيق روضة للتثبيت المباشر على أجهزة أندرويد.
            لا تحتاج إنترنت، ولا تحتوي إعلانات ولا موسيقى ولا صورًا لذوات الأرواح.
