name: بناء روضة

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: توليد مجلد أندرويد
        run: |
          flutter --version
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.rawdah --project-name rawdah .
          fi
          rm -f test/widget_test.dart
          python3 ci/patch_android.py

      - name: تثبيت الحزم
        run: flutter pub get

      - name: فحص الكود
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: اختبارات الوحدة
        run: flutter test test

      - name: مفتاح توقيع ثابت للنسخ التجريبية
        run: |
          mkdir -p ~/.android
          cp ci/test-debug.keystore ~/.android/debug.keystore

      - name: بناء APK مقسّم حسب المعالج
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
          cd build/app/outputs/flutter-apk
          # الرابط الثابت app-release.apk = نسخة arm64 (كل هواتف أندرويد الحديثة)
          cp app-arm64-v8a-release.apk app-release.apk
          ls -la *.apk
          echo "### أحجام ملفات التثبيت" >> $GITHUB_STEP_SUMMARY
          for f in app-*-release.apk; do echo "- $f: $(du -h $f | cut -f1)" >> $GITHUB_STEP_SUMMARY; done

      - name: رفع الملف
        uses: actions/upload-artifact@v4
        with:
          name: rawdah-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: نشر إصدار تجريبي
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: روضة — نسخة تجريبية ${{ github.run_number }}
          prerelease: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          body: |
            نسخة تجريبية من تطبيق روضة للتثبيت المباشر على أجهزة أندرويد.
            app-release.apk لأغلب الهواتف (arm64)، وapp-armeabi-v7a-release.apk للهواتف القديمة جدًا.
            تعمل بلا إنترنت، ولا تحتوي إعلانات ولا موسيقى ولا صورًا لذوات الأرواح.
